// AGP version comes from gradle/libs.versions.toml via the root project
// (alias libs.plugins.android.application apply false). Do not redeclare it here.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}



tasks.register("prepareKotlinBuildScriptModel"){}

android {
    namespace 'com.winlator.cmod'

    // The unfinished console interface is preserved in src/consoleUi.
    // That source set is deliberately not registered for 0.9.6: only the
    // classic interface in src/main is compiled and packaged.

    // DXVK/VKD3D payloads replaced by the maintained dxvk-and-vkd3d GitHub
    // release were moved out of src/main/assets into app/assets-removed/ —
    // AGP 8.8 ignores sourceSets assets excludes, so the files must not sit
    // in the assets source set at all. Everything else stays bundled for
    // offline/default operation.

    compileSdk 34
    buildToolsVersion "35.0.0"

    buildFeatures {
        buildConfig true
    }

// Keep the signing certificate stable so future APKs can update these
    // installations in place without deleting containers, saves or settings.
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('local.properties')
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }
    // NOTE: locals are prefixed with `ks` on purpose — naming them exactly
    // like the signingConfig fields makes Groovy resolve the statement
    // `storePassword storePassword` as String.call(String) at configuration
    // time ("No signature of method: java.lang.String.call()").
    def ksStorePassword = keystoreProps.getProperty('keystore.storePassword', System.getenv('KEYSTORE_STORE_PASSWORD') ?: 'android')
    def ksKeyAlias = keystoreProps.getProperty('keystore.keyAlias', System.getenv('KEYSTORE_KEY_ALIAS') ?: 'androiddebugkey')
    def ksKeyPassword = keystoreProps.getProperty('keystore.keyPassword', System.getenv('KEYSTORE_KEY_PASSWORD') ?: 'android')

    signingConfigs {
        winxclipseUpdate {
            storeFile file('winxclipse-update.keystore')
            storePassword ksStorePassword
            keyAlias ksKeyAlias
            keyPassword ksKeyPassword
        }
    }

    defaultConfig {
        applicationId "com.win.xclipse"
        minSdkVersion 26

        // Must stay <= 28: Android 10+ (W^X policy) blocks exec() of binaries
        // inside the app's data dir (ImageFS wine/pulseaudio) when targetSdk >= 29,
        // causing "error=13, Permission denied" at container startup.
        targetSdkVersion 28

        versionCode 27
        versionName "0.9.6"

        // Native build from Winlator sources
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.winxclipseUpdate
        }
    }

    flavorDimensions "identity"
    productFlavors {
        winxclipse {
            dimension "identity"
            applicationId "com.win.xclipse"
        }
        antutu {
            dimension "identity"
            applicationId "com.antutu.ABenchMark"
        }
        geekbench {
            dimension "identity"
            applicationId "com.primatelabs.geekbench6"
        }
        pubg {
            dimension "identity"
            applicationId "com.tencent.ig"
        }
    }


    // Java versions: Winlator uses Java 17, Termux-X11 used 1.9
    // Using 17 is typically fine (covers 1.9 features).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    // Keep Winlator’s buildTypes
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // Same certificate as installed builds so APKs update in place
            signingConfig signingConfigs.winxclipseUpdate
        }
    }

    // Release APKs are sideloaded, not published to Google Play; the low
    // targetSdk is intentional and must not fail lintVital.
    lint {
        checkReleaseBuilds false
    }


    ndkVersion '27.0.12077973'
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }


    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Real JSON parsing in JVM import tests; Android keeps its platform implementation.
    testImplementation 'org.json:json:20240303'
    // Winlator’s dependencies (androidx UI bumped for compileSdk 34 / AGP 8.8;
    // versions mirrored in gradle/libs.versions.toml)
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.21'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.0'
    implementation files('libs/MidiSynth/MidiSynth.jar')
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // 5.x: the version JavaSteam is built against (retrofit 2.9 still works on it)
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.68'
    implementation 'org.openjsse:openjsse:1.1.7'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.kohlschutter.junixsocket:junixsocket-common:2.6.0'
    implementation 'com.kohlschutter.junixsocket:junixsocket-native-common:2.6.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // Steam QR sign-in (Apache 2.0)
    implementation 'com.google.zxing:core:3.5.3'

    // Steam client protocol (MIT). SpongyCastle is the crypto provider JavaSteam looks
    // for on Android; the platform "BC" provider lacks the ciphers it needs on API 28+.
    implementation 'in.dragonbra:javasteam:1.8.0'
    implementation 'in.dragonbra:javasteam-depotdownloader:1.8.0'
    implementation 'com.madgag.spongycastle:prov:1.58.0.0'
    implementation 'com.google.protobuf:protobuf-java:4.31.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}



